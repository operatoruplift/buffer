name: Verify Buffer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_public_providers:
        description: Run optional read-only production provider probes
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Non-secret fixtures for build verification; no hosted account is used.
      SOLANA_RPC_URL: ''
      NEXT_PUBLIC_SUPABASE_URL: https://auth-fixture.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
      NEXT_PUBLIC_AUTH_EMAIL_READY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # Keep npm 11 aligned with the checked-in lockfile. npm ci validates
      # dependency resolution before applying omit flags; pinning the major
      # avoids lockfile disagreements as runner defaults change.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify alert migrations and owner isolation
        run: |
          npm install --prefix "$RUNNER_TEMP/buffer-pglite" --no-package-lock --no-audit --no-fund @electric-sql/pglite@0.5.8
          export BUFFER_PGLITE_MODULE="$RUNNER_TEMP/buffer-pglite/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/verify-alert-schema.mjs
          node scripts/verify-hosted-monitoring.mjs
          node scripts/verify-monitoring-scheduler.mjs
      - run: npm run build

  # Deterministic browser regressions block the release. External credentials
  # are absent and all account/provider transport is intercepted by fixtures.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Match the mocked browser transport at build and test time. Email flows
      # are enabled only against this invalid fixture host; real Auth tests
      # still require the separate, opt-in BUFFER_AUTH_FIXTURES credentials.
      SOLANA_RPC_URL: ''
      NEXT_PUBLIC_SUPABASE_URL: https://auth-fixture.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
      NEXT_PUBLIC_AUTH_EMAIL_READY: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test the production build
        run: |
          npm run start -- --port 3001 > /tmp/buffer-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  public-provider-probes:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_public_providers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Read the public production examples
        run: node scripts/verify-public-providers.mjs
